[project]
name = "concept-spacy"
version = "0.1.0"
description = "MCP server exposing spaCy NER + noun-chunk extraction as a single tool."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fracta contributors" }]
dependencies = [
    "mcp>=1.27,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "anyio>=4.4,<5.0",
    "structlog>=24.1,<26.0",
    "pydantic>=2.7,<3.0",
    "spacy>=3.7,<4.0",
]

[project.scripts]
concept-spacy = "concept_spacy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_spacy"]
