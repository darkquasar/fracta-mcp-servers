[project]
name = "concept-keybert"
version = "0.1.0"
description = "MCP server exposing KeyBERT keyphrase extraction as a single tool."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fracta contributors" }]
dependencies = [
    "mcp>=1.27,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "anyio>=4.4,<5.0",
    "structlog>=24.1,<26.0",
    "pydantic>=2.7,<3.0",
    # Direct torch dependency so [tool.uv.sources] below actually applies
    # (uv source overrides only bind to direct deps, not transitive ones).
    "torch>=2.7,<3.0",
    "keybert>=0.9,<0.10",
    "sentence-transformers>=3.0,<5.0",
]

[project.scripts]
concept-keybert = "concept_keybert.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_keybert"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
